<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password — Organic Profits Academy</title>
    <meta name="robots" content="noindex" />
    <script>
      // Email clients (especially iCloud Mail) sometimes strip the URL fragment
      // when proxying clicks. This page receives the bare URL and forwards the
      // query string to the hash-routed SPA.
      (function () {
        try {
          var qs = window.location.search || "";
          window.location.replace("/#/reset-password" + qs);
        } catch (e) {
          window.location.replace("/");
        }
      })();
    </script>
    <style>
      body {
        margin: 0;
        font-family: Helvetica, Arial, sans-serif;
        background: #faf8f3;
        color: #2b2419;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .box {
        text-align: center;
        max-width: 360px;
        padding: 24px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #ae9b6c;
        margin-bottom: 14px;
        font-weight: 600;
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 22px;
        margin: 0 0 12px 0;
        color: #0c1b28;
        font-weight: 500;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        opacity: 0.75;
        margin: 0 0 18px 0;
      }
      a {
        color: #7bac3f;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="eyebrow">Organic Profits Academy</div>
      <h1>Loading reset page…</h1>
      <p>If you aren't redirected automatically,
        <a href="/#/reset-password">click here</a>.
      </p>
    </div>
  </body>
</html>
